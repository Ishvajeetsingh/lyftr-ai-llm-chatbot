services:
  - type: web
    name: lyftr-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: DEFAULT_SYSTEM_PROMPT
        value: "You are a helpful AI assistant."
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
