services:
  - type: web
    name: lyftr-backend
    plan: free
    runtime: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEFAULT_SYSTEM_PROMPT
        value: "You are a helpful AI assistant."
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
