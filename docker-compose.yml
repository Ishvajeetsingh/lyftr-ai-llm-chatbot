services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ENABLE_FAILURE_SIMULATION=true
      - LLM_API_KEYS=${LLM_API_KEYS:-key_1,key_2}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.0-flash}
      - DEFAULT_SYSTEM_PROMPT=You are a helpful AI assistant.
    volumes:
      - app_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: lyftr_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
